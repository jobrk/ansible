---
- name: Development environment setup
  hosts: localhost
  connection: local
  vars:
    dotfiles_dest: "{{ lookup('env', 'DOTFILES_DEST') or lookup('env', 'HOME') ~ '/projects/dotfiles' }}"
    fnm_executable: >-
      {{ lookup('env', 'HOME') ~ '/.local/share/fnm/fnm'
         if ansible_facts['system'] == 'Linux' else 'fnm' }}
    bat_executable: >-
      {{ lookup('env', 'HOME') ~ '/.local/bin/bat'
         if ansible_facts['os_family'] == 'Debian' else 'bat' }}
    tree_sitter_version: 0.26.11
    nvim_version: 0.12.4
  pre_tasks:
    - name: Load operating system variables
      ansible.builtin.include_vars: "vars/{{ ansible_facts['os_family'] }}.yml"
      tags: always
  tasks:
    - name: Homebrew bootstrap (macOS)
      ansible.builtin.import_tasks: tasks/homebrew.yml
      when: ansible_facts['system'] == 'Darwin'

    - name: Packages
      ansible.builtin.import_tasks: tasks/packages.yml

    - name: Rust
      ansible.builtin.import_tasks: tasks/rust.yml
      tags: rust

    - name: Node
      ansible.builtin.import_tasks: tasks/node.yml
      tags: node

    - name: Tree-sitter
      ansible.builtin.import_tasks: tasks/tree-sitter.yml
      tags: neovim

    - name: Zsh
      ansible.builtin.import_tasks: tasks/zsh.yml
      tags: zsh

    - name: Neovim
      ansible.builtin.import_tasks: tasks/neovim.yml
      tags: neovim

    - name: Fonts
      ansible.builtin.import_tasks: tasks/fonts.yml
      tags: ui

    - name: Alacritty
      ansible.builtin.import_tasks: tasks/alacritty.yml
      tags: ui

    - name: MacOS extras
      ansible.builtin.import_tasks: tasks/macos.yml
      when: ansible_facts['system'] == 'Darwin'
      tags: ui

    - name: Dotfiles
      ansible.builtin.import_tasks: tasks/dotfiles.yml
      tags: dotfiles

    - name: Tmux
      ansible.builtin.import_tasks: tasks/tmux.yml
      tags: tmux

    - name: Machine-local templates
      ansible.builtin.import_tasks: tasks/templates.yml
      tags: dotfiles

  handlers:
    - name: Refresh font cache
      ansible.builtin.command: fc-cache -f ~/.fonts
      changed_when: true
