#cloud-config
users:
  - name: josh
    groups: sudo
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
write_files:
  - path: /etc/locale.gen
    append: true
    content: |
      en_US.UTF-8 UTF-8
package_update: true
locale: en_US.UTF-8
packages:
  - curl
  - locales
  - ssh-import-id
  - sudo
runcmd:
  - [sudo, -Hu, josh, ssh-import-id, gh:jobrk]
  - |
    sed -i -E '/^[[:space:]]*AcceptEnv[[:space:]]/d' /etc/ssh/sshd_config
    if [ -d /etc/ssh/sshd_config.d ]; then
      find /etc/ssh/sshd_config.d -type f -name '*.conf' -exec sed -i -E '/^[[:space:]]*AcceptEnv[[:space:]]/d' {} +
    fi
    systemctl reload ssh 2>/dev/null || service ssh reload 2>/dev/null || true
  - [sudo, -Hu, josh, bash, -c, "bash <(curl -fsSL https://raw.githubusercontent.com/jobrk/ansible/main/bootstrap.sh)"]
