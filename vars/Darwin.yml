---
homebrew_prefix: "{{ '/opt/homebrew' if ansible_facts['architecture'] == 'arm64' else '/usr/local' }}"

# Explicit opt-ins: the appearance backend needs the documented SIP/arm64e setup.
window_effects_enabled: false
window_effects_autoload: false
desktop_activate: false
window_effects_revision: 332189a4e9e1ddc98ecab230717a5a27b84b96a3
window_effects_source: "{{ ansible_facts['user_dir'] }}/.local/share/window-effects/source"
window_effects_backend: /Library/Application Support/WindowEffects

core_packages:
  - bat
  - direnv
  - dotnet
  - fd
  - fnm
  - fzf
  - git
  - git-absorb
  - git-delta
  - go
  - jq
  - openjdk@25
  - pipx
  - python@3.14
  - ripgrep
  - stow
  - stylua
  - tmux
  - tree-sitter-cli
  - zsh

cask_packages:
  - ghostty
  - font-iosevka-term-nerd-font
  - zen

ui_packages: []
display_manager_packages: []
binary_symlinks: []
