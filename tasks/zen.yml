---
- name: Add Flathub
  become: true
  tags: become
  community.general.flatpak_remote:
    name: flathub
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
    method: system
    state: present

- name: Install latest Zen Browser from Flathub
  become: true
  tags: become
  community.general.flatpak:
    name: app.zen_browser.zen
    method: system
    remote: flathub
    state: latest

- name: Check for the tarball Zen profile
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/.zen"
  register: zen_tarball_profile

- name: Check for the Flatpak Zen profile
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/.var/app/app.zen_browser.zen/.zen"
  register: zen_flatpak_profile

- name: Create the Flatpak Zen data directory
  when:
    - zen_tarball_profile.stat.exists
    - not zen_flatpak_profile.stat.exists
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.var/app/app.zen_browser.zen"
    state: directory
    mode: "0700"

- name: Move the tarball Zen profile to Flatpak
  when:
    - zen_tarball_profile.stat.exists
    - not zen_flatpak_profile.stat.exists
  ansible.builtin.command:
    argv:
      - mv
      - "{{ lookup('env', 'HOME') }}/.zen"
      - "{{ lookup('env', 'HOME') }}/.var/app/app.zen_browser.zen/.zen"
  changed_when: true

- name: Create Zen Browser Flatpak configuration directories
  become: true
  tags: become
  vars:
    zen_flatpak_arch: >-
      {{ 'aarch64' if ansible_facts['architecture'] in ['aarch64', 'arm64'] else 'x86_64' }}
    zen_systemconfig: >-
      /var/lib/flatpak/extension/app.zen_browser.zen.systemconfig/{{ zen_flatpak_arch }}/stable
  ansible.builtin.file:
    path: "{{ zen_systemconfig }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - policies
    - defaults/pref

- name: Apply Zen Browser Flatpak configuration
  become: true
  tags: become
  vars:
    zen_flatpak_arch: >-
      {{ 'aarch64' if ansible_facts['architecture'] in ['aarch64', 'arm64'] else 'x86_64' }}
    zen_systemconfig: >-
      /var/lib/flatpak/extension/app.zen_browser.zen.systemconfig/{{ zen_flatpak_arch }}/stable
  ansible.builtin.copy:
    src: "{{ lookup('env', 'HOME') }}/.config/zen/{{ item.src }}"
    dest: "{{ zen_systemconfig }}/{{ item.dest }}"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  loop:
    - { src: policies.json, dest: policies/policies.json }
    - { src: autoconfig.js, dest: defaults/pref/autoconfig.js }
    - { src: jobrk.cfg, dest: jobrk.cfg }

- name: Check the existing Zen Browser command
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/.local/bin/zen"
    follow: false
  register: zen_command

- name: Remove the retired Zen Browser command link
  when: zen_command.stat.islnk | default(false)
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.local/bin/zen"
    state: absent

- name: Create Zen Browser command
  ansible.builtin.copy:
    dest: "{{ lookup('env', 'HOME') }}/.local/bin/zen"
    mode: "0755"
    content: |
      #!/bin/sh
      exec flatpak run app.zen_browser.zen "$@"

- name: Remove the retired Zen Browser tarball installation
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ lookup('env', 'HOME') }}/.tarball-installations/zen"
    - "{{ lookup('env', 'HOME') }}/.local/share/applications/zen.desktop"

- name: Create local configuration directory
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.config"
    state: directory
    mode: "0755"

- name: Use Zen Browser for web content
  community.general.ini_file:
    path: "{{ lookup('env', 'HOME') }}/.config/mimeapps.list"
    section: Default Applications
    option: "{{ item }}"
    value: app.zen_browser.zen.desktop
    mode: "0644"
    no_extra_spaces: true
  loop:
    - application/xhtml+xml
    - text/html
    - x-scheme-handler/http
    - x-scheme-handler/https
