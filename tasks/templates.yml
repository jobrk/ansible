---
- name: Create local config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - ~/.config/alacritty
    - ~/.config/sessionizer

- name: Seed machine-local files from dotfiles templates
  ansible.builtin.copy:
    src: "{{ dotfiles_dest }}/templates/{{ item.src }}"
    dest: "{{ item.dest }}"
    force: false
    mode: "0644"
  loop:
    - { src: zshrc.local.example, dest: ~/.zshrc.local }
    - { src: gitconfig.local.example, dest: ~/.gitconfig.local }
    - { src: tmux.local.conf.example, dest: ~/.tmux.local.conf }
    - { src: alacritty.local.toml.example, dest: ~/.config/alacritty/local.toml }
    - { src: sessionizer.paths.example, dest: ~/.config/sessionizer/paths }

- name: Create Ghostty local config directory (macOS)
  when: ansible_facts['system'] == 'Darwin'
  tags: ui
  ansible.builtin.file:
    path: ~/.config/ghostty
    state: directory
    mode: "0755"

- name: Seed Ghostty local config (macOS)
  when: ansible_facts['system'] == 'Darwin'
  tags: ui
  ansible.builtin.copy:
    src: "{{ dotfiles_dest }}/templates/ghostty.local.ghostty.example"
    dest: ~/.config/ghostty/local.ghostty
    force: false
    mode: "0644"
