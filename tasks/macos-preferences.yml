---
# Explicit preferences from the existing Mac, plus native modifier dragging.
# Do not export entire preference domains: they contain machine-specific state.
- name: Apply keyboard and desktop preferences
  community.general.osx_defaults:
    domain: "{{ item.domain }}"
    key: "{{ item.key }}"
    type: "{{ item.type }}"
    value: "{{ item.value }}"
  loop:
    - { domain: NSGlobalDomain, key: KeyRepeat, type: float, value: 2.0 }
    - { domain: NSGlobalDomain, key: InitialKeyRepeat, type: float, value: 15.0 }
    - { domain: NSGlobalDomain, key: ApplePressAndHoldEnabled, type: bool, value: false }
    - { domain: NSGlobalDomain, key: _HIHideMenuBar, type: bool, value: true }
    # Ctrl+Cmd-drag anywhere in a window.
    - { domain: NSGlobalDomain, key: NSWindowShouldDragOnGesture, type: bool, value: true }
    - { domain: com.apple.dock, key: autohide, type: bool, value: true }
    - { domain: com.apple.dock, key: autohide-delay, type: int, value: 0 }
    - { domain: com.apple.dock, key: autohide-time-modifier, type: float, value: 0.0 }
    - { domain: com.apple.dock, key: mru-spaces, type: bool, value: false }
    - { domain: com.apple.WindowManager, key: EnableTiledWindowMargins, type: bool, value: false }
    - { domain: com.apple.WindowManager, key: EnableStandardClickToShowDesktop, type: bool, value: false }
  loop_control:
    label: "{{ item.domain }} / {{ item.key }}"
# Log out/in after first application. Provisioning does not restart Dock.
