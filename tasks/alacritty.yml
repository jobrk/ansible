---
- name: Check for alacritty (Linux)
  when: ansible_facts['system'] == 'Linux'
  ansible.builtin.stat:
    path: ~/.cargo/bin/alacritty
  register: alacritty_binary
  tags: rust

- name: Install alacritty via cargo (Linux)
  when: ansible_facts['system'] == 'Linux' and not alacritty_binary.stat.exists
  ansible.builtin.command:
    argv:
      - ~/.cargo/bin/cargo
      - install
      - --locked
      - --jobs
      - "1"
      - alacritty
  changed_when: true
  tags: rust
