---
- name: Check for vars/secrets.yml
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/vars/secrets.yml"
  register: secrets_file

- name: Load secrets vault
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/vars/secrets.yml"
  when: secrets_file.stat.exists
  no_log: true

- name: Create private Zsh config directory
  ansible.builtin.file:
    path: ~/.config/zsh
    state: directory
    mode: "0700"

- name: Write ~/.config/zsh/secrets.zsh
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/zsh_secrets.j2"
    dest: ~/.config/zsh/secrets.zsh
    mode: "0600"
  when: secrets_file.stat.exists and (secret_env | default({})) | length > 0
  no_log: true

- name: No secrets vault present
  ansible.builtin.debug:
    msg: "vars/secrets.yml not found — skipping ~/.config/zsh/secrets.zsh (see vars/secrets.yml.example)"
  when: not secrets_file.stat.exists
