---
- name: Check for rustup
  ansible.builtin.stat:
    path: ~/.cargo/bin/rustup
  register: rustup_binary

- name: Download rust installer
  ansible.builtin.get_url:
    url: https://sh.rustup.rs
    dest: ~/.rustup-installer
    mode: "0755"
  when: not rustup_binary.stat.exists

- name: Install rust
  ansible.builtin.command: ~/.rustup-installer -y
  when: not rustup_binary.stat.exists
  changed_when: not rustup_binary.stat.exists

- name: Remove rust installer
  ansible.builtin.file:
    path: ~/.rustup-installer
    state: absent

# No distro package on Linux; brew handles it on macOS (packages.yml)
- name: Check for git-absorb (Linux)
  when: ansible_system == 'Linux'
  ansible.builtin.stat:
    path: ~/.cargo/bin/git-absorb
  register: git_absorb_binary

- name: Install git-absorb via cargo (Linux)
  when: ansible_system == 'Linux' and not git_absorb_binary.stat.exists
  ansible.builtin.command: ~/.cargo/bin/cargo install git-absorb
  changed_when: true
