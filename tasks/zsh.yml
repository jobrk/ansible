---
- name: Set zsh as default shell
  become: true
  tags: become
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    shell: /bin/zsh

- name: Check for oh-my-zsh
  ansible.builtin.stat:
    path: ~/.oh-my-zsh
  register: oh_my_zsh

- name: Download oh-my-zsh installer
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh
    dest: ~/.oh-my-installer
    mode: "0755"
  when: not oh_my_zsh.stat.exists

- name: Install oh-my-zsh
  ansible.builtin.command: ~/.oh-my-installer --unattended --keep-zshrc
  when: not oh_my_zsh.stat.exists
  changed_when: not oh_my_zsh.stat.exists

- name: Remove oh-my-zsh installer
  ansible.builtin.file:
    path: ~/.oh-my-installer
    state: absent

- name: Install zsh plugins and theme  # noqa: latest
  ansible.builtin.git:
    repo: "https://github.com/{{ item.repo }}"
    dest: "~/.oh-my-zsh/custom/{{ item.dest }}"
    depth: 1
  loop:
    - { repo: zsh-users/zsh-autosuggestions, dest: plugins/zsh-autosuggestions }
    - { repo: zsh-users/zsh-syntax-highlighting, dest: plugins/zsh-syntax-highlighting }
    - { repo: jeffreytse/zsh-vi-mode, dest: plugins/zsh-vi-mode }
    - { repo: Aloxaf/fzf-tab, dest: plugins/fzf-tab }
    - { repo: romkatv/powerlevel10k, dest: themes/powerlevel10k }

# fzf >= 0.48 generates its own zsh bindings; ~/.fzf.zsh is sourced by .zshrc
- name: Install fzf shell integration
  ansible.builtin.shell: fzf --zsh > ~/.fzf.zsh
  args:
    creates: ~/.fzf.zsh
