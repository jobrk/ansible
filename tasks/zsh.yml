---
- name: Set zsh as default shell
  become: true
  tags: become
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: /bin/zsh

- name: Check for oh-my-zsh
  ansible.builtin.stat:
    path: ~/.oh-my-zsh
  register: oh_my_zsh

- name: Download oh-my-zsh installer
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh
    dest: ~/.oh-my-installer
    mode: "0755"
  when: not oh_my_zsh.stat.exists

- name: Install oh-my-zsh
  ansible.builtin.command: ~/.oh-my-installer --unattended --keep-zshrc
  when: not oh_my_zsh.stat.exists
  changed_when: not oh_my_zsh.stat.exists

- name: Remove oh-my-zsh installer
  ansible.builtin.file:
    path: ~/.oh-my-installer
    state: absent

- name: Install zsh plugins and theme  # noqa: latest
  ansible.builtin.git:
    repo: "https://github.com/{{ item.repo }}"
    dest: "~/.oh-my-zsh/custom/{{ item.dest }}"
    depth: 1
  loop:
    - { repo: zsh-users/zsh-autosuggestions, dest: plugins/zsh-autosuggestions }
    - { repo: zsh-users/zsh-syntax-highlighting, dest: plugins/zsh-syntax-highlighting }
    - { repo: jeffreytse/zsh-vi-mode, dest: plugins/zsh-vi-mode }
    - { repo: Aloxaf/fzf-tab, dest: plugins/fzf-tab }
    - { repo: romkatv/powerlevel10k, dest: themes/powerlevel10k }

- name: Install fzf-git  # noqa: latest
  ansible.builtin.git:
    repo: https://github.com/junegunn/fzf-git.sh
    dest: ~/.local/share/fzf-git
    depth: 1

- name: Generate fzf shell integration
  ansible.builtin.command: fzf --zsh
  register: fzf_zsh
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install fzf shell integration
  ansible.builtin.copy:
    dest: ~/.fzf.zsh
    content: "{{ fzf_zsh.stdout }}\n"
    mode: "0644"
  when: fzf_zsh.rc == 0

- name: Install packaged fzf shell integration
  ansible.builtin.copy:
    dest: ~/.fzf.zsh
    mode: "0644"
    content: |
      for fzf_shell_dir in /usr/share/doc/fzf/examples /usr/share/fzf/shell; do
        if [[ -r "$fzf_shell_dir/key-bindings.zsh" ]]; then
          [[ -r "$fzf_shell_dir/completion.zsh" ]] && source "$fzf_shell_dir/completion.zsh"
          source "$fzf_shell_dir/key-bindings.zsh"
          break
        fi
      done
      unset fzf_shell_dir
  when: fzf_zsh.rc != 0
