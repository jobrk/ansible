---
- name: Check for fnm
  ansible.builtin.command: "{{ fnm_executable }} --version"
  register: fnm_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Download fnm installer
  ansible.builtin.get_url:
    url: https://fnm.vercel.app/install
    dest: ~/.fnm-installer
    mode: "0755"
  when: fnm_check.rc != 0

- name: Install fnm
  ansible.builtin.command: ~/.fnm-installer --skip-shell
  when: fnm_check.rc != 0
  changed_when: true

- name: Remove fnm installer
  ansible.builtin.file:
    path: ~/.fnm-installer
    state: absent

- name: Symlink fnm into ~/.local/bin (Linux)
  ansible.builtin.file:
    src: "{{ fnm_executable }}"
    dest: ~/.local/bin/fnm
    state: link
  when: ansible_facts['system'] == 'Linux'

- name: Install latest LTS node
  ansible.builtin.command: "{{ fnm_executable }} install --lts --corepack-enabled"
  register: fnm_install
  changed_when: "'already installed' not in fnm_install.stderr"
