---
- name: Check for Microsoft package feed (Debian)
  when: ansible_facts['distribution'] == 'Debian'
  ansible.builtin.command:
    argv:
      - dpkg-query
      - --show
      - packages-microsoft-prod
  register: microsoft_feed
  changed_when: false
  failed_when: false

- name: Configure Microsoft package feed (Debian)
  when:
    - ansible_facts['distribution'] == 'Debian'
    - microsoft_feed.rc != 0
  block:
    - name: Install Microsoft package feed prerequisites
      become: true
      tags: become
      ansible.builtin.apt:
        update_cache: true
        name:
          - ca-certificates
          - xz-utils

    - name: Download Microsoft package feed
      become: true
      tags: become
      ansible.builtin.get_url:
        url: >-
          https://packages.microsoft.com/config/debian/{{ ansible_facts['distribution_major_version'] }}/packages-microsoft-prod.deb
        dest: /tmp/packages-microsoft-prod.deb
        mode: "0644"

    - name: Install Microsoft package feed
      become: true
      tags: become
      ansible.builtin.apt:
        deb: /tmp/packages-microsoft-prod.deb

    - name: Remove Microsoft package feed installer
      become: true
      tags: become
      ansible.builtin.file:
        path: /tmp/packages-microsoft-prod.deb
        state: absent

- name: Install core packages (apt)
  become: true
  tags: become
  when: ansible_facts['os_family'] == 'Debian'
  ansible.builtin.apt:
    update_cache: true
    name: "{{ core_packages }}"

- name: Generate US English locale
  become: true
  tags: become
  when: ansible_facts['os_family'] == 'Debian'
  community.general.locale_gen:
    name: en_US.UTF-8
    state: present

- name: Set US English as the default locale
  become: true
  tags: become
  when: ansible_facts['os_family'] == 'Debian'
  ansible.builtin.lineinfile:
    path: /etc/default/locale
    regexp: '^LANG='
    line: LANG=en_US.UTF-8
    create: true
    mode: "0644"

- name: Check for SSH daemon configuration
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config
  register: sshd_config
  when: ansible_facts['os_family'] == 'Debian'

- name: Find SSH daemon configuration snippets
  become: true
  tags: become
  ansible.builtin.find:
    paths: /etc/ssh/sshd_config.d
    patterns: "*.conf"
    file_type: file
  register: sshd_config_snippets
  when:
    - ansible_facts['os_family'] == 'Debian'
    - sshd_config.stat.exists

- name: Ignore locale variables forwarded by SSH clients
  become: true
  tags: become
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    regexp: '^\s*AcceptEnv\s'
    state: absent
  loop: >-
    {{ ['/etc/ssh/sshd_config'] +
       (sshd_config_snippets.files | default([]) | map(attribute='path') | list) }}
  when:
    - ansible_facts['os_family'] == 'Debian'
    - sshd_config.stat.exists
  notify: Reload SSH

- name: Enable Debian backports for Hyprland
  become: true
  tags:
    - become
    - ui
  when: ansible_facts['distribution'] == 'Debian'
  ansible.builtin.copy:
    dest: "/etc/apt/sources.list.d/{{ ansible_facts['distribution_release'] }}-backports.list"
    content: >-
      deb http://deb.debian.org/debian
      {{ ansible_facts['distribution_release'] }}-backports main
    owner: root
    group: root
    mode: "0644"

- name: Refresh apt metadata for Debian backports
  become: true
  tags:
    - become
    - ui
  when: ansible_facts['distribution'] == 'Debian'
  ansible.builtin.apt:
    update_cache: true

- name: Install Fedora repository tooling
  become: true
  tags:
    - become
    - ui
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.dnf:
    name: dnf-plugins-core

- name: Check for the Hyprland COPR
  tags: ui
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.stat:
    path: /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:lionheartp:Hyprland.repo
  register: hyprland_copr

- name: Enable the Hyprland COPR
  become: true
  tags:
    - become
    - ui
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - not hyprland_copr.stat.exists
  ansible.builtin.command:
    argv:
      - dnf
      - copr
      - enable
      - --assumeyes
      - lionheartp/Hyprland
  changed_when: true

- name: Check for an existing display manager
  tags: ui
  when: ansible_facts['system'] == 'Linux'
  ansible.builtin.stat:
    path: /etc/systemd/system/display-manager.service
    follow: false
  register: display_manager_service

- name: Decide whether greetd should replace the display manager
  tags: ui
  when: ansible_facts['system'] == 'Linux'
  ansible.builtin.set_fact:
    install_greetd: >-
      {{ not display_manager_service.stat.exists or
         'lightdm' in (display_manager_service.stat.lnk_source | default('')) }}
    manage_greetd: >-
      {{ not display_manager_service.stat.exists or
         'lightdm' in (display_manager_service.stat.lnk_source | default('')) or
         'greetd' in (display_manager_service.stat.lnk_source | default('')) }}

- name: Install UI packages (apt)
  become: true
  tags:
    - become
    - ui
  when: ansible_facts['os_family'] == 'Debian'
  ansible.builtin.apt:
    update_cache: true
    default_release: >-
      {{ ansible_facts['distribution_release'] ~ '-backports'
         if ansible_facts['distribution'] == 'Debian' else omit }}
    name: "{{ ui_packages }}"

- name: Install core packages (dnf)
  become: true
  tags: become
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.dnf:
    update_cache: true
    name: "{{ core_packages }}"

- name: Install UI packages (dnf)
  become: true
  tags:
    - become
    - ui
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.dnf:
    name: "{{ ui_packages }}"

- name: Disable the retired LightDM service
  become: true
  tags:
    - become
    - ui
  when:
    - ansible_facts['system'] == 'Linux'
    - install_greetd
    - display_manager_service.stat.exists
  ansible.builtin.systemd_service:
    name: lightdm
    enabled: false

- name: Remove the retired LightDM display manager link
  become: true
  tags:
    - become
    - ui
  when:
    - ansible_facts['system'] == 'Linux'
    - install_greetd
    - display_manager_service.stat.exists
  ansible.builtin.file:
    path: /etc/systemd/system/display-manager.service
    state: absent

- name: Install greetd when no Wayland display manager exists
  become: true
  tags:
    - become
    - ui
  when:
    - ansible_facts['system'] == 'Linux'
    - install_greetd
  ansible.builtin.package:
    name: "{{ display_manager_packages }}"

- name: Configure the minimal greetd login
  become: true
  tags:
    - become
    - ui
  when:
    - ansible_facts['system'] == 'Linux'
    - manage_greetd
  ansible.builtin.copy:
    dest: /etc/greetd/config.toml
    content: |
      [terminal]
      vt = {{ greetd_vt }}

      [default_session]
      command = "{{ agreety_path }} --cmd /usr/bin/start-hyprland"
      user = "{{ greetd_user }}"
    owner: root
    group: root
    mode: "0644"

- name: Ensure the managed greetd service is enabled
  become: true
  tags:
    - become
    - ui
  when:
    - ansible_facts['system'] == 'Linux'
    - manage_greetd
  ansible.builtin.systemd_service:
    name: greetd
    enabled: true

- name: Read the default systemd target
  tags: ui
  when: ansible_facts['system'] == 'Linux'
  ansible.builtin.command: systemctl get-default
  register: default_systemd_target
  changed_when: false

- name: Boot Linux UI machines into the graphical target
  become: true
  tags:
    - become
    - ui
  when:
    - ansible_facts['system'] == 'Linux'
    - default_systemd_target.stdout != 'graphical.target'
  ansible.builtin.command: systemctl set-default graphical.target
  changed_when: true

- name: Create AccountsService user directory
  become: true
  tags:
    - become
    - ui
  when: ansible_facts['system'] == 'Linux'
  ansible.builtin.file:
    path: /var/lib/AccountsService/users
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Select Hyprland as the default desktop session
  become: true
  tags:
    - become
    - ui
  when: ansible_facts['system'] == 'Linux'
  community.general.ini_file:
    path: "/var/lib/AccountsService/users/{{ ansible_facts['user_id'] }}"
    section: User
    option: XSession
    value: hyprland
    owner: root
    group: root
    mode: "0600"
    no_extra_spaces: true

- name: Install core packages (homebrew)
  when: ansible_facts['os_family'] == 'Darwin'
  community.general.homebrew:
    update_homebrew: true
    name: "{{ core_packages }}"

- name: Install cask packages (homebrew)
  when: ansible_facts['os_family'] == 'Darwin'
  tags: ui
  community.general.homebrew_cask:
    name: "{{ cask_packages }}"

- name: Create ~/.local/bin
  ansible.builtin.file:
    path: ~/.local/bin
    state: directory
    mode: "0755"

- name: Symlink renamed distro binaries (bat/fd on Debian)
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
  loop: "{{ binary_symlinks }}"
