---
- name: Find latest stable Neovim release
  ansible.builtin.uri:
    url: https://api.github.com/repos/neovim/neovim/releases/latest
    headers:
      Accept: application/vnd.github+json
    return_content: true
  register: nvim_release
  changed_when: false
  check_mode: false

- name: Select Neovim release asset
  vars:
    nvim_platform: "{{ 'macos' if ansible_facts['system'] == 'Darwin' else 'linux' }}"
    nvim_arch: "{{ 'arm64' if ansible_facts['architecture'] in ['aarch64', 'arm64'] else 'x86_64' }}"
    nvim_asset_name: "nvim-{{ nvim_platform }}-{{ nvim_arch }}.tar.gz"
    nvim_asset: "{{ nvim_release.json.assets | selectattr('name', 'equalto', nvim_asset_name) | first }}"
  ansible.builtin.set_fact:
    nvim_version: "{{ nvim_release.json.tag_name | regex_replace('^v', '') }}"
    nvim_download_url: "{{ nvim_asset.browser_download_url }}"
    nvim_checksum: "{{ nvim_asset.digest }}"
    nvim_release_dir: "{{ nvim_asset_name | regex_replace('\\.tar\\.gz$', '') }}"

- name: Check Neovim version
  ansible.builtin.command: ~/.local/nvim/bin/nvim --version
  register: nvim_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install latest stable Neovim release
  when: >-
    nvim_check.rc != 0 or
    ('NVIM v' ~ nvim_version) not in nvim_check.stdout_lines or
    nvim_force | default(false)
  vars:
    nvim_local_dir: "{{ lookup('env', 'HOME') }}/.local"
    nvim_archive: "{{ nvim_local_dir }}/{{ nvim_release_dir }}-v{{ nvim_version }}.tar.gz"
  block:
    - name: Download Neovim release
      ansible.builtin.get_url:
        url: "{{ nvim_download_url }}"
        dest: "{{ nvim_archive }}"
        checksum: "{{ nvim_checksum }}"
        mode: "0644"

    - name: Remove previous Neovim tree
      ansible.builtin.file:
        path: "{{ nvim_local_dir }}/{{ nvim_release_dir }}"
        state: absent

    - name: Extract Neovim release
      ansible.builtin.command:
        argv:
          - /usr/bin/tar
          - -xzf
          - "{{ nvim_archive }}"
          - -C
          - "{{ nvim_local_dir }}"
      changed_when: true

    - name: Remove Neovim archive
      ansible.builtin.file:
        path: "{{ nvim_archive }}"
        state: absent

    - name: Point ~/.local/nvim at the stable release
      ansible.builtin.file:
        src: "{{ nvim_local_dir }}/{{ nvim_release_dir }}"
        dest: ~/.local/nvim
        state: link
        force: true

    - name: Symlink nvim into ~/.local/bin
      ansible.builtin.file:
        src: ~/.local/nvim/bin/nvim
        dest: ~/.local/bin/nvim
        state: link
        force: true
