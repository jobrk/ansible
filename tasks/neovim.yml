---
# Linux: distro repos lag badly (Ubuntu LTS ships 0.6-0.11; config needs 0.12+),
# so install the upstream release tarball. macOS: brew formula tracks stable.
# Upgrade an existing install with: ansible-playbook main.yml -e nvim_force=true

- name: Check for neovim (Linux)
  when: ansible_system == 'Linux'
  ansible.builtin.stat:
    path: ~/.local/nvim/bin/nvim
  register: nvim_binary

- name: Install neovim from release tarball (Linux)
  when: ansible_system == 'Linux' and (not nvim_binary.stat.exists or nvim_force | default(false))
  vars:
    nvim_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else ansible_architecture }}"
  block:
    - name: Download neovim stable tarball
      ansible.builtin.unarchive:
        src: "https://github.com/neovim/neovim/releases/latest/download/nvim-linux-{{ nvim_arch }}.tar.gz"
        dest: ~/.local
        remote_src: true

    - name: Point ~/.local/nvim at the unpacked tree
      ansible.builtin.file:
        src: "~/.local/nvim-linux-{{ nvim_arch }}"
        dest: ~/.local/nvim
        state: link

    - name: Symlink nvim into ~/.local/bin
      ansible.builtin.file:
        src: ~/.local/nvim/bin/nvim
        dest: ~/.local/bin/nvim
        state: link

# Config arrives via the dotfiles nvim submodule (stowed); plugins bootstrap
# on first launch (lazy.nvim). No headless sync here by design.

- name: Enable stylua pre-commit hook in nvim config
  ansible.builtin.command: git config core.hooksPath .githooks
  args:
    chdir: ~/dotfiles/nvim/.config/nvim
  changed_when: false
  failed_when: false
  tags: dotfiles
