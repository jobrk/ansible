---
- name: Add AeroSpace Homebrew tap
  community.general.homebrew_tap:
    name: nikitabobko/tap
    state: present
  tags: aerospace

- name: Install AeroSpace
  community.general.homebrew_cask:
    name: nikitabobko/tap/aerospace
    state: present
  tags: aerospace

- name: Desktop preferences
  ansible.builtin.import_tasks: macos-preferences.yml
  tags: macos-preferences
