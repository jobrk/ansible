---
# Run only after cutover. Native Spaces, custom config directories and SIP stay
# untouched. Back up local legacy configuration before requesting this tag.
- name: Check that the legacy daemons are stopped
  ansible.builtin.command: pgrep -x 'yabai|skhd'
  register: legacy_desktop_processes
  changed_when: false
  failed_when: legacy_desktop_processes.rc not in [0, 1]
  check_mode: false

- name: Require the desktop cutover before cleanup
  ansible.builtin.assert:
    that: legacy_desktop_processes.rc == 1
    fail_msg: Complete the desktop cutover and stop yabai/skhd before cleanup.

- name: Verify AeroSpace is responding
  ansible.builtin.command: aerospace list-workspaces --all
  changed_when: false
  check_mode: false

- name: Verify the Window Effects backend is responding
  ansible.builtin.command: "{{ ansible_facts['user_dir'] }}/.local/bin/window-effects doctor"
  changed_when: false
  check_mode: false

- name: Read disabled user services
  ansible.builtin.command: "launchctl print-disabled gui/{{ ansible_facts['user_uid'] }}"
  register: desktop_disabled_services
  changed_when: false
  check_mode: false

- name: Disable current and historical legacy service labels
  ansible.builtin.command: "launchctl disable gui/{{ ansible_facts['user_uid'] }}/{{ item }}"
  loop: &legacy_desktop_labels
    - com.asmvik.yabai
    - com.koekeishiya.yabai
    - com.koekeishiya.skhd
  when: ('"' ~ item ~ '" => disabled') not in desktop_disabled_services.stdout
  changed_when: true

- name: Check whether legacy agents are loaded
  ansible.builtin.command: "launchctl print gui/{{ ansible_facts['user_uid'] }}/{{ item }}"
  loop: *legacy_desktop_labels
  register: legacy_desktop_agents
  changed_when: false
  failed_when: legacy_desktop_agents.rc not in [0, 113]
  check_mode: false

- name: Unload remaining legacy agents
  ansible.builtin.command: "launchctl bootout gui/{{ ansible_facts['user_uid'] }}/{{ item.item }}"
  loop: "{{ legacy_desktop_agents.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc == 0
  changed_when: true

- name: Remove legacy LaunchAgent files
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/Library/LaunchAgents/{{ item }}.plist"
    state: absent
  loop: *legacy_desktop_labels

- name: Inspect former Stow links
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/.config/{{ item }}"
    follow: false
  loop: [yabai, skhd]
  register: legacy_desktop_configs

- name: Remove only legacy links owned by this dotfiles checkout
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/{{ item.item }}"
    state: absent
  loop: "{{ legacy_desktop_configs.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - item.stat.islnk | default(false)
    - item.stat.lnk_source == dotfiles_dest ~ '/' ~ item.item ~ '/.config/' ~ item.item

- name: Uninstall the retired window manager and shortcut daemon
  community.general.homebrew:
    name: [yabai, skhd]
    state: absent

- name: Remove privileged yabai remnants
  become: true
  tags: desktop-cleanup-root
  block:
    - name: Remove yabai's scripting addition and sudoers rule
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /Library/ScriptingAdditions/yabai.osax
        - /etc/sudoers.d/yabai

    - name: Validate sudoers after cleanup
      ansible.builtin.command: /usr/sbin/visudo -c
      changed_when: false
      when: not ansible_check_mode
